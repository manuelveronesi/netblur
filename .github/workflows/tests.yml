name: tests

on:
  push:
  pull_request:
  schedule:
    # Monthly run, so runner image or Python changes show up even when nothing is pushed.
    - cron: '17 6 3 * *'
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
        exclude:
          # ubuntu-latest is Ubuntu 26.04, which has no prebuilt Python 3.9
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-22.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python tests/run_tests.py
      - run: pip install .
      - run: netblur --version
