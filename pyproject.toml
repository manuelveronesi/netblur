[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netblur"
dynamic = ["version"]
description = "Mask secrets and personal data in network device configurations (Fortinet, Cisco, Zyxel, MikroTik, 3CX and more) before sharing them with an AI or anyone else"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Manuel Veronesi" }]
keywords = [
    "network", "configuration", "sanitizer", "anonymization", "secrets", "redaction",
    "fortinet", "cisco", "zyxel", "mikrotik", "3cx", "firewall", "voip", "ai", "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/manuelveronesi/netblur"
Issues = "https://github.com/manuelveronesi/netblur/issues"
Changelog = "https://github.com/manuelveronesi/netblur/blob/main/CHANGELOG.md"

[project.scripts]
netblur = "netblur:main"

[tool.setuptools]
py-modules = ["netblur"]

[tool.setuptools.dynamic]
version = { attr = "netblur.VERSION" }
