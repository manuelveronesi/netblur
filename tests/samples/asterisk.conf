; Asterisk / FreePBX sample (sip.conf, pjsip, manager.conf, voicemail.conf and dialplan fragments in one file)
[general]
register => 1001:LEAKreg1@sip.provider.example/1001
register => tls://1002@sip.provider.example:LEAKreg2:authuser1002@sip.provider.example
secret = LEAKgeneral ; trailing comment
alwaysauthreject=yes

[1001]
type=friend
secret=LEAKsipsecret
md5secret=LEAKmd5secret
callerid="John Smith" <1001>
username=1001
fromuser=trunkaccount
host=dynamic
context=from-internal

[trunk-provider-auth]
type=auth
auth_type=userpass
password=LEAKpjsip
username=trunkaccount

[admin]
secret = LEAKami
deny=0.0.0.0/0.0.0.0
permit=192.168.1.0/255.255.255.0
read = system,call,log
write = all

[default]
1001 => 1234,John Smith,john.smith@example.com,,attach=yes|saycid=no
1002 => 98765,Jane Doe,,

[from-internal]
exten => 100,1,Dial(SIP/trunk:LEAKdial@sip.provider.example/${EXTEN})
exten => 101,1,Dial(IAX2/iaxuser:LEAKiax@iax.provider.example/${EXTEN},30)
exten => 102,1,Set(TRUNK=PJSIP/101@trunk)
exten => 103,1,Set(DB(AMPUSER/103/password)=LEAKdb)

[secret]
LEAK0123456789abcdef0123456789abcdef
[1]
Dial=1

[globals]
AMPMGRPASS = LEAKmgrpass
AMPDBPASS = LEAKdbpass
AMPDBUSER = freepbxuser
MIXMON_BEEP = 
capture_password = LEAKhep
