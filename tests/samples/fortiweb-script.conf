config system automation-action
  edit "backup"
    set action-type cli-script
    set script "execute backup full-config sftp backups/waf-backup.conf backupuser:LEAKsftp@192.0.2.53:22"
  next
  edit "backup2"
    set script "execute backup config ftp cfg.conf 10.0.0.9 ftpuser:LEAK@weird@pw@10.0.0.9"
  next
end
config system admin
  edit "x"
    set comments "see https://user:LEAKurl@intranet.example.com/path and https://intranet.example.com/plain"
  next
end
execute restore config tftp cfg.conf 10.0.0.1
config system certificate local
  edit "c"
    set certificate "-----BEGIN CERTIFICATE-----
MIIBpublicCERTOK
-----END CERTIFICATE-----"
    set private-key "-----BEGIN ENCRYPTED PRIVATE KEY-----
MIIELEAKkey
-----END ENCRYPTED PRIVATE KEY-----"
  next
end
set time 10:30:00
set server ntp1.example.com
