version 15.2
hostname R1
enable secret 9 $9$LEAKenable
username admin privilege 15 secret 9 $9$LEAKuser
username old password 7 LEAK0822
service password-encryption
password encryption aes
key config-key password-encrypt LEAKmaster
snmp-server community LEAKro RO 10
snmp-server community LEAKrw RW
snmp-server user u1 G1 v3 auth sha LEAKauth priv aes 128 LEAKpriv
snmp-server host 10.1.1.1 version 2c LEAKhostcomm
snmp-server host 10.1.1.2 LEAKhostv1
snmp-server host 10.1.1.3 informs version 3 priv u1
tacacs-server host 10.0.0.1 key 7 LEAKtac
tacacs server TAC1
 address ipv4 10.0.0.2
 key 7 LEAKtac2
radius-server key LEAKrad
crypto isakmp policy 10
 authentication pre-share
crypto isakmp key LEAKisakmp address 0.0.0.0
crypto key generate rsa modulus 2048
key chain EIGRP
 key 1
  key-string 7 LEAKkeystr
interface Gi0/0
 ip ospf authentication-key 7 LEAKospf
 ip ospf message-digest-key 1 md5 LEAKmd5
 standby 1 authentication md5 key-string LEAKhsrp
 vrrp 1 authentication text LEAKvrrp
router bgp 65000
 neighbor 1.2.3.4 password 7 LEAKbgp
ntp authentication-key 10 md5 LEAKntp 7
dot11 ssid TEST
 wpa-psk ascii 0 LEAKwpa
line vty 0 4
 password 7 LEAKvty
