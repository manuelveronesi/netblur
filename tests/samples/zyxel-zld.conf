! ZLD startup-config sample, invented values only
hostname ZYWALL-TEST
username admin encrypted-password $4$LEAKsalt$LEAKhashAAAAAAAAAAAAAAAAAAAA$ user-type admin
username tech password LEAKplain user-type limited-admin
no pwd-expiry force-to-change-pwd
aaa group server ad AD_SRV
 server host 10.0.0.10
 server password-encrypted $4$LEAKad$LEAKadhashBBBBBBBBBBBBBBBBBB$
 server ssl
 exit
aaa group server ldap LDAP_SRV
 server password LEAKldap
 exit
aaa group server radius RADIUS_SRV
 server host 10.0.0.11
 server key LEAKradgroup
 exit
radius-server key LEAKraddefault
snmp-server community LEAKcomm ro
isakmp policy SITE_B
 mode main
 authentication pre-share
 keystring LEAKpsk
 encrypted-keystring $4$LEAKike$LEAKikehashCCCCCCCCCCCCCCCCCC$
 exit
account pppoe ISP_MAIN
 user isp-account-01
 encrypted-password $4$LEAKppp$LEAKppphashDDDDDDDDDDDDDDDDDD$
 authentication chap-pap
 exit
wlan-security-profile OFFICE
 mode wpa2
 wpa-encrypt aes
 wpa-psk LEAKwpa
 exit
wlan-security-profile GUEST
 wpa-psk-encrypted $4$LEAKwlan$LEAKwlanhashEEEEEEEEEEEEEEEEE$
 exit
interface wlan-1-1
 security wpa aes psk key LEAKwlanif
 exit
