#config-version=FGT60F-7.2.8
config system admin
    edit "admin"
        set password ENC SH2LEAKhash
    next
end
config vpn ipsec phase1-interface
    edit "VPN1"
        set authmethod psk
        set psksecret ENC LEAKpsk
        set ppk-secret ENC LEAKppk
    next
end
config system snmp community
    edit 1
        set name "LEAKcomm"
        config hosts
            edit 1
                set ip 10.0.0.1 255.255.255.255
            next
        end
    next
end
config system snmp user
    edit "snmpuser"
        set auth-pwd ENC LEAKauth
        set priv-pwd ENC LEAKpriv
    next
end
config router ospf
    config ospf-interface
        edit "if1"
            set md5-keys 1 ENC LEAKmd5
        next
    end
end
config vpn certificate local
    edit "cert1"
        set private-key "-----BEGIN ENCRYPTED PRIVATE KEY-----
MIIFLEAKLEAKLEAK
-----END ENCRYPTED PRIVATE KEY-----"
        set certificate "-----BEGIN CERTIFICATE-----
MIIpublic
-----END CERTIFICATE-----"
    next
end
config wireless-controller vap
    edit "wifi"
        set passphrase ENC LEAKwifi
    next
end
config user ldap
    edit "ad"
        set password ENC LEAKldap
    next
end
