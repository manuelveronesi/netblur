interfaces {
    ethernet eth0 {
        address dhcp
    }
}
service {
    snmp {
        community LEAKcomm {
            authorization ro
        }
    }
}
system {
    login {
        user ubnt {
            authentication {
                encrypted-password $6$LEAKhash
                plaintext-password ""
            }
        }
    }
}
vpn {
    ipsec {
        site-to-site {
            peer 1.2.3.4 {
                authentication {
                    mode pre-shared-secret
                    pre-shared-secret LEAKpsk
                }
            }
        }
    }
    l2tp {
        remote-access {
            authentication {
                local-users {
                    username u1 {
                        password LEAKl2tp
                    }
                }
            }
        }
    }
}
